version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nudy_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nudy_user
      POSTGRES_PASSWORD: nudy_password
      POSTGRES_DB: nudy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudy_user -d nudy_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Redis Queue & Cache Service
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nudy_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # MinIO (S3-Compatible Private Storage)
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: nudy_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------------------------
  # Nudy Web Application
  # ----------------------------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nudy_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - DATABASE_URL=postgresql://nudy_user:nudy_password@postgres:5432/nudy_db?schema=public
      - REDIS_URL=redis://redis:6379
      - STORAGE_PROVIDER=minio
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=us-east-1
      - S3_BUCKET_NAME=nudy-private-assets
      - S3_ACCESS_KEY_ID=minioadmin
      - S3_SECRET_ACCESS_KEY=minioadminpassword
      - S3_FORCE_PATH_STYLE=true
      - GENERATION_PROVIDER=mock
      - KYC_PROVIDER=mock
      - PAYMENT_PROVIDER=mock
      - AUTH_SECRET=production-secret-auth-key-min-32-characters
      - JWT_SECRET=production-secret-jwt-key-min-32-characters
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
